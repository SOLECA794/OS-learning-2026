[package]
name = "uapp"
version = "0.1.0"
edition = "2021"
publish = false

# fault-test：W2 附加用例②（用户态访问内核保护区）的独立入口，
# 由 Makefile `make user-fault` 显式开启，产物为 build/user/uapp_fault.elf。
[features]
fault-test = []

[profile.release]
panic = "abort"
[[bin]]
name = "uapp2"
path = "src/bin/uapp2.rs"
[[bin]]
name = "shell"
path = "src/bin/shell.rs"
[[bin]]
name = "uapp-cow"
path = "src/bin/uapp-cow.rs"
[[bin]]
name = "uapp-console"
path = "src/bin/uapp-console.rs"
[[bin]]
name = "uapp-vfs"
path = "src/bin/uapp-vfs.rs"
[[bin]]
name = "vfs-exec"
path = "src/bin/vfs-exec.rs"
[[bin]]
name = "uapp-brk"
path = "src/bin/uapp-brk.rs"
[[bin]]
name = "uapp-pipe"
path = "src/bin/uapp-pipe.rs"
